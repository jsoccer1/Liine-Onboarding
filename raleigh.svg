<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Raleigh skyline illustration</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16383a"/>
      <stop offset="0.55" stop-color="#2f7f7c"/>
      <stop offset="1" stop-color="#e7b7bf"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" fill="url(#sky)"/>
  <circle cx="430" cy="300" r="70" fill="#f3c4cc" fill-opacity="0.9"/>
  <g fill="#ffffff" fill-opacity="0.6">
    <circle cx="90" cy="120" r="1.6"/><circle cx="200" cy="70" r="1.2"/><circle cx="330" cy="140" r="1.4"/>
    <circle cx="520" cy="90" r="1.6"/><circle cx="470" cy="190" r="1"/><circle cx="60" cy="240" r="1.2"/>
  </g>
  <!-- skyline -->
  <g fill="#1c4a49">
    <rect x="40" y="520" width="70" height="380"/>
    <rect x="120" y="460" width="60" height="440"/>
    <rect x="400" y="430" width="80" height="470"/>
    <rect x="490" y="500" width="70" height="400"/>
    <rect x="350" y="540" width="50" height="360"/>
  </g>
  <!-- capitol -->
  <g fill="#173d3c">
    <rect x="200" y="600" width="150" height="300"/>
    <rect x="235" y="545" width="80" height="60"/>
    <path d="M240 548a35 40 0 0 1 70 0z"/>
    <rect x="271" y="485" width="8" height="30"/>
    <rect x="190" y="592" width="170" height="10"/>
  </g>
  <g fill="#f3c4cc" fill-opacity="0.55">
    <rect x="135" y="490" width="8" height="10"/><rect x="155" y="520" width="8" height="10"/>
    <rect x="420" y="470" width="8" height="10"/><rect x="445" y="510" width="8" height="10"/>
    <rect x="510" y="540" width="8" height="10"/><rect x="60" y="560" width="8" height="10"/>
  </g>
  <!-- oaks -->
  <g fill="#0f2b2a">
    <ellipse cx="60" cy="760" rx="110" ry="80"/>
    <ellipse cx="190" cy="790" rx="100" ry="70"/>
    <ellipse cx="420" cy="780" rx="120" ry="80"/>
    <ellipse cx="560" cy="750" rx="100" ry="85"/>
    <rect x="0" y="790" width="600" height="110"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
